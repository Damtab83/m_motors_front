<div class="nav-bar">
  <div class="header-menu">
    <a matButton [routerLink]="['/home']">
      <mat-icon>home</mat-icon>
      Home
    </a>
    <a matButton [routerLink]="['/shop-car']">
      <mat-icon>directions_car</mat-icon>
      Cars
    </a>
    @if (dashboardLink; as destination) {
      <a matButton [routerLink]="[destination]">
        <mat-icon>account_circle</mat-icon>
        Mon compte
      </a>
      <a matButton [routerLink]="['/home']" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Déconnexion
      </a>
    } @else {
      <a matButton [routerLink]="['/login']">
        <mat-icon>login</mat-icon>
        Connexion
      </a>
      <a matButton [routerLink]="['/register']">
        <mat-icon>person_add</mat-icon>
        Inscription
      </a>
    }
  </div>
  <mat-slide-toggle>Toggle me!</mat-slide-toggle>


  <div class="footer">
    <p>
      <mat-icon>
          copyright
      </mat-icon>
      <span>Copyright {{this.myYear}}</span>
    </p>
    <p>
      <a mat-button [routerLink]="['/sales-conditions']">
        <mat-icon>description</mat-icon>
        <span>CGV</span>
      </a>
    </p>
    <p>
      <a mat-button [routerLink]="['/notice-legal']">
      <mat-icon>gavel</mat-icon>
      <span>Mentions Légales</span>
      </a>
    </p>
    <p>
      <a mat-button [routerLink]="['/contact']">
      <mat-icon>call</mat-icon>
      <span>Contact</span>
      </a>
    </p>  
    
  </div>  
</div>
